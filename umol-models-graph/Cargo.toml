[package]
name = "umol-models-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
atoi = "2.0.0"
bitflags = { version = "2.9.4", features = ["serde"] }
bstr = "1.12.0"
fast-float = "0.2.0"
float-cmp = "0.10.0"
indexmap = { version = "2.11.1", features = ["serde"] }
map-macro = "0.3.0"
memchr = "2.7.4"
nalgebra = { version = "0.34.0", features = ["serde-serialize"] }
nom = { version = "8.0.0" }
num = "0.4.3"
num-traits = "0.2.19"
once_cell = "1.21.3"
petgraph = { version = "0.8.2", features = ["stable_graph", "serde-1"] }
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
slog = "2.7.0"
smallvec = "1.15.1"
umol = { path = "../umol" }
umol-data = { path = "../umol-data" }

[build-dependencies]
walkdir = "2.5.0"

[dev-dependencies]
criterion = "0.7.0"
fastrand = "2.3.0"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
pretty_assertions = "1.4.1"
proptest = "1.7.0"
rand =  "0.9.2"
rand_chacha = "0.9.0"
rstest = "0.26.1"
serde_json = "1.0.145"
serde_yaml = "0.9.34"

[lib]
bench = false

[[bin]]
name = "mol_classifier"
bench = false

[[bin]]
name = "test_mol_file"
bench = false

[[bin]]
name = "error_analyzer"
bench = false

[[bin]]
name = "file_catalog"
bench = false

[[bench]]
name = "mol_parsing"
harness = false

[[bench]]
name = "opensmiles_parsing"
harness = false
