[package]
name = "umol-models-graph"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2.4.0"
float-cmp = "0.10"
num-traits = "0.2.19"
nalgebra = "0.33"
nom = { version = "8.0.0" }
num = "0.4.3"
petgraph = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
umol = { path = "../umol" }
umol-data = { path = "../umol-data" }
fast-float = "0.2.0"
smallvec = "1.15.1"

[dev-dependencies]
rstest = "0.25.0"
pretty_assertions = "1.4.0"
criterion = "0.6.0"

[[bench]]
name = "parsing_bench"
harness = false
