[package]
name = "umol-msym"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
description = "Ergonomic Rust wrapper for libmsym (molecular symmetry)"
license = "MIT"

[dependencies]
umol-msym-sys = { path = "../umol-msym-sys" }
nalgebra = "0.34.0"
thiserror = "2"

[dev-dependencies]
rand = "0.9"
rand_chacha = "0.9"
rstest = "0.25"

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
