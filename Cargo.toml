[workspace]
members = [
    "umol-ast",
    "umol-ast-macros",
    "umol-shared",
    "umol-edn",
    "umol-edn-macros",
    "umol-geometric",
    "umol-graph",
    "umol-graph-core",
    "umol-msym",
    "umol-msym-sys",
    "umol-params",
]
exclude = ["umol-ast/fuzz", "umol-edn/fuzz", "umol-graph/fuzz"]
resolver = "2"

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = 1
