[workspace]
members = [
    "umol-graph-ir",
    "umol-graph-ir-macros",
    "umol-chem",
    "umol-utils",
    "umol-edn",
    "umol-edn-macros",
    "umol-geometric",
    "umol-geometric-core",
    "umol-geometric-graph",
    "umol-graph",
    "umol-graph-core",
    "umol-io",
    "umol-msym",
    "umol-msym-sys",
    "umol-nauty-sys",
    "umol-params",
    "umol-perm",
    "umol-py",
]
exclude = ["umol-graph-ir/fuzz", "umol-edn/fuzz", "umol-io/fuzz"]
resolver = "2"

[workspace.package]
rust-version = "1.87"

[workspace.dependencies]
cc = "1.2.60"

[profile.bench]
debug = true

[profile.profiling]
inherits = "release"
debug = 1
