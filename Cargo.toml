[package]
name = "umol"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.20.3"
petgraph = "0.7.1"
thiserror = "1.0"
map-macro = "0.3.0"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
slog = "2.7.0"
slog-term = "2.9.1"
slog-async = "2.8.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
rstest = "0.18"
