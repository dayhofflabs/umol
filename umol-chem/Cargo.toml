[package]
name = "umol-chem"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = [
    "chemistry",
    "cheminformatics",
    "molecules",
    "isotopes",
    "units",
]
description = "Chemistry vocabulary types (elements, isotopes, spin, occupation, units) for umol."

[lib]
bench = false

[dependencies]
umol-utils = { path = "../umol-utils", version = "0.8.0" }
bitvec = { version = "1.0.1", features = ["serde"] }
map-macro = "0.3.0"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8.1"
float-cmp = "0.10.0"
pretty_assertions = "1.4.1"
rstest = "0.26.1"

[[bench]]
name = "elements"
harness = false

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
