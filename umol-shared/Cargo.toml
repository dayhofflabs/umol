[package]
name = "umol-shared"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "computational chemistry",
    "molecular modeling",
    "molecular representation",
]
description = "Shared algebraic and chemistry types for umol."

[lib]
bench = false

[dependencies]
bitvec = { version = "1.0.1", features = ["serde"] }
map-macro = "0.3.0"
phf = { version = "0.13.1", features = ["macros"] }
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.145"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.8.1"
float-cmp = "0.10.0"
pretty_assertions = "1.4.1"
rstest = "0.26.1"

[[bench]]
name = "elements"
harness = false

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
