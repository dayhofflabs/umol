name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to check out when called by another workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Rust components
        run: |
          rustup component add clippy
          rustup toolchain install nightly-2026-06-04 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +nightly-2026-06-04 fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  test:
    name: Workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run all test suites
        run: cargo test --locked --workspace --all-features --tests --no-fail-fast

  msrv:
    name: Rust 1.87
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.87.0 --profile minimal
      - name: Check workspace with minimum supported Rust
        run: cargo +1.87.0 check --locked --workspace --all-targets --all-features

  gate:
    name: Rust CI gate
    if: ${{ always() }}
    needs: [quality, test, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust job to pass
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.msrv.result }}" = success
