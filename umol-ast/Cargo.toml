[package]
name = "umol-ast"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "computational chemistry",
    "molecular modeling",
    "molecular representation",
]
description = "DSL and AST layers for umol molecular representation."
autobenches = false
autotests = false

[lib]
bench = false

[features]
proptest = []

[dependencies]
bimap = "0.6.3"
bitflags = "2.9.4"
indexmap = "2.11.1"
smallvec = "1.15.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0"
umol-ast-macros = { path = "../umol-ast-macros", version = "0.1.0" }
umol-edn = { path = "../umol-edn", version = "0.1.0", features = [
    "macros",
    "indexmap",
] }
umol-graph-core = { path = "../umol-graph-core", version = "0.1.0" }
umol-perm = { path = "../umol-perm", version = "0.1.0" }
umol-chem = { path = "../umol-chem", version = "0.1.0" }
umol-utils = { path = "../umol-utils", version = "0.1.0" }
winnow = "1.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4.1"
proptest = "1.6"
rstest = "0.26.1"

[[test]]
name = "property"
required-features = ["proptest"]

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "rendering"
harness = false

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "ground"
harness = false

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
