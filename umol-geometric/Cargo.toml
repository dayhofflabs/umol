[package]
name = "umol-geometric"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "computational chemistry",
    "molecular modeling",
    "molecular representation",
]
description = "3D geometric molecular models for umol."
edition = "2021"

[lib]
bench = false

[dependencies]
nalgebra = "0.34.0"
nom = { version = "8.0.0" }
num = "0.4.3"
num-traits = "0.2.19"
umol = { path = "../umol", version = "0.1.0" }
umol-data = { path = "../umol-data", version = "0.1.0" }

[dev-dependencies]
criterion = "0.8.1"
float-cmp = "0.10.0"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
