[package]
name = "umol-models-valence"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = ["chemistry", "cheminformatics", "molecular parsing"]
edition = "2021"

[dependencies]
umol = { path = "../umol" }
umol-macros = { path = "../umol-macros" }
umol-data = { path = "../umol-data" }
once_cell = "1.20.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
map-macro = "0.3.0"
regex = "1.10.1"
petgraph = "0.8.1"
indexmap = "2.2.6"

[dev-dependencies]
rstest = "*"
