[package]
name = "umol-graph-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["algorithms", "graph", "isomorphism", "canonicalization"]
description = "Graph data structures and algorithms for umol."
exclude = ["/tests"]

[lib]
bench = false

[features]
proptest = []

[dependencies]
bitvec = "1.0.1"
num-bigint = "0.4"
umol-nauty-sys = { path = "../umol-nauty-sys", version = "0.6.0" }

[dev-dependencies]
criterion = "0.8.1"
pretty_assertions = "1.4.1"
proptest = "1.7.0"
rstest = "0.26.1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }

[[test]]
name = "property"
required-features = ["proptest"]

[[bench]]
name = "algorithms"
harness = false

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
