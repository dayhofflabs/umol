[package]
name = "umol-graph"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = [
    "chemistry",
    "cheminformatics",
    "molecules",
    "graph",
    "reactions",
]
description = "Graph-based molecular models for umol."
autotests = false

[lib]
bench = false

[[test]]
name = "resolution"
required-features = ["conformance"]

[[test]]
name = "property"
required-features = ["proptest"]

[[test]]
name = "matching"

[[test]]
name = "kekulization"

[[test]]
name = "fingerprint"

[[test]]
name = "whitepaper"

[[bin]]
name = "test_mol_file"
bench = false

[[bin]]
name = "classify_mol_files"
bench = false

[[bin]]
name = "classify_sdf_files"
bench = false

[[bin]]
name = "test_smiles"
bench = false

[[bin]]
name = "classify_smiles_strings"
bench = false

[[bin]]
name = "verify_stereo"
bench = false

[features]
conformance = []
proptest = []

[dependencies]
bitvec = "1.0.1"
clap = { version = "4", features = ["derive"] }
umol-graph-ir = { path = "../umol-graph-ir", version = "0.6.0" }
umol-edn = { path = "../umol-edn", version = "0.6.0", features = [
    "macros",
    "indexmap",
] }
umol-graph-core = { path = "../umol-graph-core", version = "0.6.0" }
umol-io = { path = "../umol-io", version = "0.6.0" }
murmur3 = "0.5"
nalgebra = "0.34.0"
smallvec = "1.15.1"
rand = "0.10"
rand_chacha = "0.10"
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
strum = "0.28.0"
thiserror = "2.0"
toml = "1.1.0"
umol-chem = { path = "../umol-chem", version = "0.6.0" }
umol-utils = { path = "../umol-utils", version = "0.6.0" }
umol-params = { path = "../umol-params", version = "0.6.0" }
umol-perm = { path = "../umol-perm", version = "0.6.0" }
xxhash-rust = { version = "0.8.15", features = ["const_xxh3", "xxh3"] }

[dev-dependencies]
criterion = "0.8.1"
fastrand = "2.3.0"
float-cmp = "0.10.0"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
pretty_assertions = "1.4.1"
proptest = "1.7.0"
rstest = "0.26.1"
walkdir = "2.5.0"

[[bench]]
name = "fingerprint"
harness = false

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "substructure"
harness = false

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
