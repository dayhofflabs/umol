[package]
name = "umol-graph"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "computational chemistry",
    "molecular modeling",
    "molecular representation",
]
description = "Graph-based molecular models for umol."

[lib]
bench = false

[[bin]]
name = "test_mol_file"
bench = false

[[bin]]
name = "classify_mol_files"
bench = false

[[bin]]
name = "classify_sdf_files"
bench = false

[[bin]]
name = "test_smiles"
bench = false

[[bin]]
name = "classify_smiles_strings"
bench = false

[[bin]]
name = "parse_smiles"
bench = false

[features]
conformance = []

[dependencies]
bitflags = "2.9.4"
bstr = "1.12.0"
clap = { version = "4", features = ["derive"] }
umol-edn = { path = "../umol-edn", version = "0.1.0", features = ["macros", "indexmap"] }
fast-float2 = "0.2.3"
indexmap = "2.11.1"
itertools = "0.14.0"
map-macro = "0.3.0"
murmur3 = "0.5"
nauty-Traces-sys = "0.11"
nalgebra = "0.34.0"
nom = { version = "8.0.0" }
num = "0.4.3"
petgraph = { version = "0.8.2", features = ["stable_graph"] }
rand = "0.10"
rand_chacha = "0.10"
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
smallvec = "1.15.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.0"
umol = { path = "../umol", version = "0.1.0" }
umol-shared = { path = "../umol-shared", version = "0.1.0" }
umol-params = { path = "../umol-params", version = "0.1.0" }
xxhash-rust = { version = "0.8.15", features = ["const_xxh3"] }
bimap = "0.6.3"

[build-dependencies]
walkdir = "2.5.0"

[dev-dependencies]
criterion = "0.8.1"
fastrand = "2.3.0"
float-cmp = "0.10.0"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
pretty_assertions = "1.4.1"
proptest = "1.7.0"
rand = "0.10"
rand_chacha = "0.10"
rstest = "0.26.1"

[[bench]]
name = "mol_parsing"
harness = false

[[bench]]
name = "smiles_parsing"
harness = false

[[bench]]
name = "molecule_dsl_parsing"
harness = false
