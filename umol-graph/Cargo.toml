[package]
name = "umol-graph"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "computational chemistry",
    "molecular modeling",
    "molecular representation",
]
description = "Graph-based molecular models for umol."
autotests = false

[lib]
bench = false

[[test]]
name = "resolution"
required-features = ["conformance"]

[[bin]]
name = "test_mol_file"
bench = false

[[bin]]
name = "classify_mol_files"
bench = false

[[bin]]
name = "classify_sdf_files"
bench = false

[[bin]]
name = "test_smiles"
bench = false

[[bin]]
name = "classify_smiles_strings"
bench = false

[[bin]]
name = "stereo"
bench = false

[features]
conformance = []

[dependencies]
clap = { version = "4", features = ["derive"] }
umol-ast = { path = "../umol-ast", version = "0.1.0" }
umol-edn = { path = "../umol-edn", version = "0.1.0", features = ["macros", "indexmap"] }
umol-graph-core = { path = "../umol-graph-core", version = "0.1.0" }
umol-io = { path = "../umol-io", version = "0.1.0" }
murmur3 = "0.5"
nalgebra = "0.35.0"
rand = "0.10"
rand_chacha = "0.10"
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
thiserror = "2.0"
toml = "1.1.0"
umol-shared = { path = "../umol-shared", version = "0.1.0" }
umol-params = { path = "../umol-params", version = "0.1.0" }
xxhash-rust = { version = "0.8.15", features = ["const_xxh3", "xxh3"] }

[dev-dependencies]
criterion = "0.8.1"
fastrand = "2.3.0"
float-cmp = "0.10.0"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
pretty_assertions = "1.4.1"
rstest = "0.26.1"
walkdir = "2.5.0"

[[bench]]
name = "morgan"
harness = false
required-features = ["legacy"]

[[bench]]
name = "substructure"
harness = false
required-features = ["legacy"]

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
