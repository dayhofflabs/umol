target_covalences = [4]
aromatic_valences = [1]

[P]
target_covalences = [3, 5]
aromatic_valences = [1, 2]

[S]
target_covalences = [2, 4, 6]
aromatic_valences = [2]

[Cl]
target_covalences = [1, 3, 5, 7]

[Ar]
target_covalences = [0]

[K]
target_covalences = [1]

[Ca]
target_covalences = [2]

[Ga]
