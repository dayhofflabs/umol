# Per-element data for the counts valence model: the living default table.
# Its content coincides with the SMILES superset table (the most permissive
# of the frozen releases) and may evolve; additions of larger covalence
# targets are purely additive under the smallest-target rule, while the
# frozen preset tables never change in place.
#
# target_covalences: Lewis/Langmuir saturation targets, sorted smallest to
#   largest; Counts uses the first entry >= v + inc when #h is free, and past
#   the largest target the atom is saturated: no hydrogens are added (the
#   OpenSMILES over-valence reading). Literal #h overrides. Ions read the
#   isoelectronic entry via an element shift.
# fallback_aromatic_valences: consulted only when aromatic_valences admits no
#   candidate for the atom. Carbon's zero-pi entry covers the aromatic carbon
#   whose frame admits no pi contribution (the exocyclic-carbonyl ring carbon
#   of 2-pyridone, tropone).
[H]
target_covalences = [1]

[He]
target_covalences = [0]

[Li]
target_covalences = [1]

[Be]
target_covalences = [2]

[B]
target_covalences = [3]
aromatic_valences = [0]

[C]
target_covalences = [4]
aromatic_valences = [1]
fallback_aromatic_valences = [0]

[N]
target_covalences = [3, 5]
aromatic_valences = [1, 2]

[O]
target_covalences = [2]
aromatic_valences = [2]

[F]
target_covalences = [1]

