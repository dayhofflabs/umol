# Per-element data for the counts valence model. An element absent from this
# table is out of the model's scope and left to other resolvers.
#
# covalence_set: allowed covalences — localized valence + implicit H + aromatic
#   increment — for the neutral atom; ions read the isoelectronic entry via an
#   element shift.
[H]
covalence_set = [1]

[He]
covalence_set = [0]

[Li]
covalence_set = [1]

[Be]
covalence_set = [2]

