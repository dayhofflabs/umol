# MDL/CTfile valence table for the counts valence model: the frozen release
# behind `ValenceModel::mdl()`. Content inherited from the historical default
# table; a row-by-row audit against the CTfile specification's default-valence
# appendix is pending. Frozen: revisions are new named files, never edits.
#
# target_covalences: Lewis/Langmuir saturation targets, sorted smallest to
#   largest; Counts uses the first entry >= v + inc when #h is free, and past
#   the largest target the atom is saturated: no hydrogens are added (the
#   OpenSMILES over-valence reading). Literal #h overrides. Ions read the
#   isoelectronic entry via an element shift.
[H]
target_covalences = [1]

[He]
target_covalences = [0]

[Li]
target_covalences = [1]

[Be]
target_covalences = [2]

[B]
target_covalences = [3]
aromatic_valences = [0]

[C]
target_covalences = [4]
aromatic_valences = [1]

[N]
target_covalences = [3]
aromatic_valences = [1, 2]

[O]
target_covalences = [2]
aromatic_valences = [2]

[F]
target_covalences = [1]

