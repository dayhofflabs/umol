# MDL/CTfile valence table for the counts valence model: the frozen release
# behind `ValenceModel::mdl()`: the neutral (q = 0) column of the MDL valence
# model, verified row by row against the model's transcription by NextMove
# Software (OpenBabel src/formats/mdlvalence.h, vendored at
# materials/formats/mol/openbabel-mdlvalence) — the CTfile specification
# itself defines only the vvv atom-block field, not the per-element defaults
# (MDL CTFile Formats; vendored at materials/formats/mol). The model's charge
# tables are isoelectronic shifts of the neutral column, so the counts
# resolver's element shift reproduces them exactly, including the gap rows
# (charges the model omits shift onto elements without entries). Noble-gas
# rows transcribe the model's absent rows behaviorally: target zero, past
# which saturation adds no hydrogens. Frozen: revisions are new named files,
# never edits.
#
# target_covalences: Lewis/Langmuir saturation targets, sorted smallest to
#   largest; Counts uses the first entry >= v + inc when #h is free, and past
#   the largest target the atom is saturated: no hydrogens are added (the
#   OpenSMILES over-valence reading). Literal #h overrides. Ions read the
#   isoelectronic entry via an element shift.
#
# fallback_aromatic_valences: aromatic valences consulted only when
# aromatic_valences admits no candidate for the atom; carbon's zero-pi entry
# covers the exocyclic-carbonyl ring carbon of 2-pyridone-class inputs. The
# column is umol's pi-contribution reading with no toolkit counterpart.
[H]
target_covalences = [1]

[He]
target_covalences = [0]

[Li]
target_covalences = [1]

[Be]
target_covalences = [2]

[B]
target_covalences = [3]
aromatic_valences = [0]

[C]
target_covalences = [4]
aromatic_valences = [1]
fallback_aromatic_valences = [0]

[N]
target_covalences = [3, 5]
aromatic_valences = [1, 2]

[O]
target_covalences = [2]
aromatic_valences = [2]

