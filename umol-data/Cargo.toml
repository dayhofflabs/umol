[package]
name = "umol-data"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = ["chemistry", "cheminformatics", "computational chemistry", "molecular modeling", "molecular representation"]
description = "Chemical data repository for umol."

[dependencies]
atoi = "2.0.0"
bitvec = { version = "1.0.1", features = ["serde"] }
map-macro = "0.3.0"
phf = { version = "0.13.1", features = ["macros"] }
regex = "1.11.2"
serde = { version = "1.0.221", features = ["derive"] }
serde_json = "1.0.145"
umol = { path = "../umol", version = "0.1.0" }

[dev-dependencies]
rstest = "0.26.1"
pretty_assertions = "1.4.1"
criterion = "0.8.1"
float-cmp = "0.10.0"

[lib]
bench = false

[[bench]]
name = "elements"
harness = false
