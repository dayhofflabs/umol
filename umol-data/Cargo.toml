[package]
name = "umol-data"
version = "0.1.0"
edition = "2021"

[dependencies]
float-cmp = "0.10"
map-macro = "0.3"
once_cell = { version = "1.21" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
umol = { path = "../umol" }
phf = { version = "0.12", features = ["macros"] }
bitvec = { version = "1.0", features = ["serde"] }
atoi = "2.0"

[dev-dependencies]
rstest = "0.26.0"
pretty_assertions = "1.4.0"
criterion = "0.6.0"

[[bench]]
name = "data_bench"
harness = false
