[package]
name = "umol-data"
version = "0.1.0"
edition = "2021"

[dependencies]
float-cmp = "0.10"
map-macro = "0.3"
once_cell = { version = "1.21" }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
umol = { path = "../umol" }
phf = { version = "0.12", features = ["macros"] }

[dev-dependencies]
rstest = "*"
