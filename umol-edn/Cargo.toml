[package]
name = "umol-edn"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["edn", "parser", "data-format", "clojure"]
description = "EDN (Extensible Data Notation) parser, formatter, and serde integration."

[lib]
bench = false

[dependencies]
itoa = "1.0"
zmij = "1.0"
memchr = "2.7"
hashbrown = { version = "0.17", features = ["default-hasher"] }
thiserror = "2.0"
winnow = "1.0"

indexmap = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
num-bigint = { version = "0.4", optional = true }
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }
uuid = { version = "1.0", optional = true }
umol-edn-macros = { path = "../umol-edn-macros", version = "0.7.0", optional = true }

[features]
serde = ["dep:serde"]
indexmap = ["dep:indexmap"]
bignum = ["dep:num-bigint", "dep:bigdecimal"]
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
macros = ["dep:umol-edn-macros"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4.1"
proptest = "1.6"
rstest = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[test]]
name = "conformance"
required-features = ["serde"]

[[test]]
name = "derives"
required-features = ["macros"]

[[test]]
name = "import_paths"
required-features = ["serde", "macros"]

[[test]]
name = "macros"
required-features = ["macros"]

[[test]]
name = "parity"
required-features = ["serde"]

[[bench]]
name = "parsing"
harness = false
required-features = ["serde"]

[[bench]]
name = "memory"
harness = false
required-features = ["serde"]

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
