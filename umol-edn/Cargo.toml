[package]
name = "umol-edn"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = ["edn", "parser", "data-format", "clojure"]
description = "EDN (Extensible Data Notation) parser, formatter, and serde integration."

[lib]
bench = false

[dependencies]
itoa = "1.0"
zmij = "1.0"
memchr = "2.7"
hashbrown = { version = "0.15", features = ["default-hasher"] }
winnow = "1.0"

serde = { version = "1.0", features = ["derive"], optional = true }
num-bigint = { version = "0.4", optional = true }
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", optional = true }
uuid = { version = "1.0", optional = true }
umol-edn-macros = { path = "../umol-edn-macros", optional = true }

[features]
serde = ["dep:serde"]
bignum = ["dep:num-bigint", "dep:bigdecimal"]
chrono = ["dep:chrono"]
uuid = ["dep:uuid"]
macros = ["dep:umol-edn-macros"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4.1"
proptest = "1.6"
rstest = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
umol-edn = { path = ".", features = ["serde", "macros"] }

[[bench]]
name = "parsing"
harness = false

