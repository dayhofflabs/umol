[package]
name = "umol"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
map-macro = "0.3.0"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = "2.7.0"
slog-term = "2.9.1"
slog-async = "2.8.0"
umol-macros = { path = "../umol-macros" }