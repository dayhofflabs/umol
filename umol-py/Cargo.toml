[package]
name = "umol-py"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["chemistry", "cheminformatics", "molecules", "reactions", "python"]
description = "Python bindings for umol molecular representation."

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
bench = false

[features]
default = ["graph"]
depiction = ["graph", "umol-io/depiction"]
graph = [
    "dep:umol-graph-ir",
    "dep:umol-chem",
    "dep:umol-graph",
    "dep:umol-graph-core",
    "dep:umol-io",
    "dep:umol-perm",
    "dep:umol-utils",
]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39", "multiple-pymethods"] }
umol-graph-ir = { path = "../umol-graph-ir", version = "0.8.0", optional = true }
umol-chem = { path = "../umol-chem", version = "0.8.0", optional = true }
umol-graph = { path = "../umol-graph", version = "0.8.0", optional = true }
umol-graph-core = { path = "../umol-graph-core", version = "0.8.0", optional = true }
umol-io = { path = "../umol-io", version = "0.8.0", optional = true }
umol-perm = { path = "../umol-perm", version = "0.8.0", optional = true }
umol-utils = { path = "../umol-utils", version = "0.8.0", optional = true }

[dev-dependencies]
rstest = "0.26.1"
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
