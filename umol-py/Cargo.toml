[package]
name = "umol-py"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
description = "Python bindings for umol molecular representation."

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]
bench = false

[features]
default = ["graph"]
graph = ["dep:umol-ast", "dep:umol-chem"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
umol-ast = { path = "../umol-ast", version = "0.1.0", optional = true }
umol-chem = { path = "../umol-chem", version = "0.1.0", optional = true }

[dev-dependencies]
rstest = "0.26.1"
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
