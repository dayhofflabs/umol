[package]
name = "umol-io"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
keywords = [
    "chemistry",
    "cheminformatics",
    "file formats",
    "smiles",
    "molfile",
]
description = "Molecular file-format parsers (SMILES, CTFile) and the TableIR boundary type for umol."
autotests = false

[lib]
bench = false

[[test]]
name = "mol_parsing"

[[test]]
name = "sdf_parsing"

[[test]]
name = "smiles_parsing"

[[test]]
name = "smiles_property"
required-features = ["proptest"]

[[bench]]
name = "mol_parsing"
harness = false

[[bench]]
name = "smiles_parsing"
harness = false

[features]
conformance = []
proptest = []

[dependencies]
bitflags = "2.9.4"
bstr = "1.12.0"
fast-float2 = "0.2.3"
indexmap = "2.11.1"
map-macro = "0.3.0"
nom = { version = "8.0.0" }
num = "0.4.3"
regex = "1.11.2"
smallvec = "1.15.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0"
umol-ast = { path = "../umol-ast", version = "0.1.0" }
umol-geometric-core = { path = "../umol-geometric-core", version = "0.1.0" }
umol-perm = { path = "../umol-perm", version = "0.1.0" }
umol-shared = { path = "../umol-shared", version = "0.1.0" }

[dev-dependencies]
criterion = "0.8.1"
float-cmp = "0.10.0"
insta = { version = "1.43.2", features = ["yaml", "glob"] }
pretty_assertions = "1.4.1"
proptest = "1.7.0"
rstest = "0.26.1"
serde = { version = "1.0.221", features = ["derive"] }
