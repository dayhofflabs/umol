[package]
name = "umol-utils"
version = "0.1.0"
authors = ["Dmitrij Rappoport <dmitrij@rappoport.org>"]
edition = "2021"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/rappoport/umol"
description = "Cross-cutting infrastructure (error trait, three-valued outcome) for umol."

[lib]
bench = false

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.26.1"

[lints.clippy]
absolute_paths = "warn"
mod_module_files = "warn"
